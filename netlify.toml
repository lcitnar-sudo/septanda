[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[context.deploy-preview.environment]
  SEPTANDA_STORE = "septanda-players-preview-v1"

[context.branch-deploy.environment]
  SEPTANDA_STORE = "septanda-players-branch-v1"

[[redirects]]
  from = "/literatura"
  to = "/literatura.html"
  status = 200
